# OTA Node Configuration
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MAIN_STACK_SIZE=4096

# Enable WiFi
CONFIG_WIFI=y

# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# Get IPv4 address from DHCP
CONFIG_NET_DHCPV4=y

# Enable DNS resolver
CONFIG_DNS_RESOLVER=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=30

# Enable Ethernet (required for WiFi)
CONFIG_NET_L2_ETHERNET=y

# Network debug config
CONFIG_NET_LOG=y

# MCUboot bootloader
CONFIG_BOOTLOADER_MCUBOOT=y

# Flash layout - A/B partitions
CONFIG_MCUBOOT_FLASH_LAYOUT_DEFAULT=y
CONFIG_MCUBOOT_VALIDATE_SLOT0=y

# Network timeout
CONFIG_NET_WORKQ_STACK_SIZE=4096

# System settings
CONFIG_REBOOT=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048